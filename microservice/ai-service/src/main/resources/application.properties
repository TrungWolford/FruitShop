spring.application.name=ai-service
server.port=8086

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.max-output-tokens=1024
gemini.temperature=0.7

services.config.base-url=${CONFIG_SERVICE_URL:http://localhost:8081}
services.config.ai-config-path=/api/config/ai/active
services.rag.base-url=${RAG_SERVICE_URL:http://localhost:8082}
services.rag.search-path=/api/rag/search

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=60s

resilience4j.retry.instances.llmApi.max-attempts=3
resilience4j.retry.instances.llmApi.wait-duration=500ms

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Spring AI Vector Store (PGVector)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE

