spring.application.name=cart-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cart_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.cloud.openfeign.circuitbreaker.enabled=true

jwt.secret=${JWT_SECRET:fruitshop-super-secret-key-change-this-in-production-32bytes-min}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# RabbitMQ / Spring Cloud Stream Config
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

spring.cloud.function.definition=orderCreatedConsumer;productDeletedConsumer;productUpdatedConsumer;accountDeactivatedConsumer
# Consumers
spring.cloud.stream.bindings.orderCreatedConsumer-in-0.destination=fruitshop.orders.created
spring.cloud.stream.bindings.orderCreatedConsumer-in-0.group=cart-service-group
spring.cloud.stream.bindings.productDeletedConsumer-in-0.destination=fruitshop.products.deleted
spring.cloud.stream.bindings.productDeletedConsumer-in-0.group=cart-service-group
spring.cloud.stream.bindings.productUpdatedConsumer-in-0.destination=fruitshop.products.updated
spring.cloud.stream.bindings.productUpdatedConsumer-in-0.group=cart-service-group
spring.cloud.stream.bindings.accountDeactivatedConsumer-in-0.destination=fruitshop.accounts.deactivated
spring.cloud.stream.bindings.accountDeactivatedConsumer-in-0.group=cart-service-group

# Dead Letter Queue (DLQ) Default Config
spring.cloud.stream.rabbit.default.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.default.consumer.republish-to-dlq=true
spring.cloud.stream.rabbit.default.consumer.dlq-ttl=604800000
