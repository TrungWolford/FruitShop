spring.application.name=review-service
server.port=${SERVER_PORT:8087}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/review_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.cloud.openfeign.circuitbreaker.enabled=true

# RabbitMQ / Spring Cloud Stream Config
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Publishers
spring.cloud.stream.function.definition=productDeletedConsumer;accountDeactivatedConsumer
spring.cloud.stream.bindings.ratingCreatedSupplier-out-0.destination=fruitshop.ratings.created
spring.cloud.stream.bindings.ratingUpdatedSupplier-out-0.destination=fruitshop.ratings.updated
# Consumers
spring.cloud.stream.bindings.productDeletedConsumer-in-0.destination=fruitshop.products.deleted
spring.cloud.stream.bindings.productDeletedConsumer-in-0.group=review-service-group
spring.cloud.stream.bindings.accountDeactivatedConsumer-in-0.destination=fruitshop.account.deactivated

spring.cloud.stream.bindings.accountDeactivatedConsumer-in-0.group=review-service-group


# Dead Letter Queue (DLQ) Default Config
spring.cloud.stream.rabbit.default.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.default.consumer.republish-to-dlq=true
spring.cloud.stream.rabbit.default.consumer.dlq-ttl=604800000
