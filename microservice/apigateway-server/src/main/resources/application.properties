spring.application.name=apigateway-server

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Explicit routes for stable path-based gateway access from FE.
spring.cloud.gateway.server.webmvc.routes[0].id=account-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ACCOUNT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/account-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CATALOG-SERVICE
