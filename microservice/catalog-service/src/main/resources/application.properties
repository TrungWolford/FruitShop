spring.application.name=catalog-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

jwt.secret=${JWT_SECRET:fruitshop-super-secret-key-change-this-in-production-32bytes-min}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.secure=true

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# RabbitMQ / Spring Cloud Stream Config
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

spring.cloud.function.definition=ratingCreatedConsumer;ratingUpdatedConsumer;orderConfirmedConsumer
spring.cloud.stream.bindings.ratingCreatedConsumer-in-0.destination=fruitshop.ratings.created
spring.cloud.stream.bindings.ratingCreatedConsumer-in-0.group=catalog-service-group
spring.cloud.stream.bindings.ratingUpdatedConsumer-in-0.destination=fruitshop.ratings.updated
spring.cloud.stream.bindings.ratingUpdatedConsumer-in-0.group=catalog-service-group
spring.cloud.stream.bindings.orderConfirmedConsumer-in-0.destination=fruitshop.orders.confirmed
spring.cloud.stream.bindings.orderConfirmedConsumer-in-0.group=catalog-service-group

# Publishers
spring.cloud.stream.bindings.productDeletedSupplier-out-0.destination=fruitshop.products.deleted
spring.cloud.stream.bindings.productUpdatedSupplier-out-0.destination=fruitshop.products.updated

# Jackson Config to handle null for primitives
spring.jackson.deserialization.fail-on-null-for-primitives=false

