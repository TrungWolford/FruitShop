spring.application.name=payment-service
server.port=${SERVER_PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.cloud.openfeign.circuitbreaker.enabled=true

# RabbitMQ / Spring Cloud Stream Config
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

spring.cloud.function.definition=orderCreatedConsumer;refundApprovedConsumer
# Publishers
spring.cloud.stream.bindings.paymentCompletedSupplier-out-0.destination=fruitshop.payments.completed
spring.cloud.stream.bindings.paymentFailedSupplier-out-0.destination=fruitshop.payments.failed
spring.cloud.stream.bindings.refundCompletedSupplier-out-0.destination=fruitshop.refunds.completed
spring.cloud.stream.bindings.refundFailedSupplier-out-0.destination=fruitshop.refunds.failed

# Consumers
spring.cloud.stream.bindings.orderCreatedConsumer-in-0.destination=fruitshop.orders.created
spring.cloud.stream.bindings.orderCreatedConsumer-in-0.group=payment-service-group
spring.cloud.stream.bindings.refundApprovedConsumer-in-0.destination=fruitshop.refunds.approved
spring.cloud.stream.bindings.refundApprovedConsumer-in-0.group=payment-service-group
spring.cloud.stream.bindings.refundApprovedConsumer-in-0.group=payment-service-group

momo.endpoint=${MOMO_ENDPOINT:http://localhost:8999}
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.return-url=${MOMO_RETURN_URL:http://localhost:8080/payment/return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/payment/ipn}
momo.request-type=${MOMO_REQUEST_TYPE:captureWallet}

# Dead Letter Queue (DLQ) Default Config
spring.cloud.stream.rabbit.default.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.default.consumer.republish-to-dlq=true
spring.cloud.stream.rabbit.default.consumer.dlq-ttl=604800000
