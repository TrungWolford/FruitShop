services:
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: fruitshop-discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    restart: unless-stopped
    networks:
      - fruitshop-micro-network

  apigateway-server:
    build:
      context: ./apigateway-server
      dockerfile: Dockerfile
    container_name: fruitshop-apigateway-server
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    restart: unless-stopped
    networks:
      - fruitshop-micro-network

networks:
  fruitshop-micro-network:
    driver: bridge