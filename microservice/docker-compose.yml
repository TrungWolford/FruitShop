services:
  postgres-account:
    image: postgres:16-alpine
    container_name: fruitshop-account-db
    command: ["postgres", "-p", "5436"]
    environment:
      POSTGRES_DB: account_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5436"
    volumes:
      - account_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5436 -U postgres -d account_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fruitshop-micro-network

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: fruitshop-discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fruitshop-micro-network

  flyway-account:
    image: flyway/flyway:11-alpine
    container_name: fruitshop-flyway-account
    command:
      - -url=jdbc:postgresql://postgres-account:5436/account_service
      - -user=postgres
      - -password=postgres
      - -connectRetries=30
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ./account-service/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres-account:
        condition: service_healthy
    networks:
      - fruitshop-micro-network

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: fruitshop-account-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-account:5436/account_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      postgres-account:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      flyway-account:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - fruitshop-micro-network

  apigateway-server:
    build:
      context: ./apigateway-server
      dockerfile: Dockerfile
    container_name: fruitshop-apigateway-server
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      account-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - fruitshop-micro-network

volumes:
  account_postgres_data:

networks:
  fruitshop-micro-network:
    driver: bridge