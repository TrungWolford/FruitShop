spring.application.name=order-service
server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.cloud.openfeign.circuitbreaker.enabled=true

jwt.secret=${JWT_SECRET:fruitshop-super-secret-key-change-this-in-production-32bytes-min}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# RabbitMQ / Spring Cloud Stream Config
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

spring.cloud.function.definition=paymentCompletedConsumer;paymentFailedConsumer;refundCompletedConsumer;refundFailedConsumer;accountDeactivatedConsumer

# Publishers
spring.cloud.stream.bindings.orderCreatedSupplier-out-0.destination=fruitshop.orders.created
spring.cloud.stream.bindings.orderConfirmedSupplier-out-0.destination=fruitshop.orders.confirmed
spring.cloud.stream.bindings.refundRequestedSupplier-out-0.destination=fruitshop.refunds.requested
spring.cloud.stream.bindings.refundApprovedSupplier-out-0.destination=fruitshop.refunds.approved

# Consumers
spring.cloud.stream.bindings.paymentCompletedConsumer-in-0.destination=fruitshop.payments.completed
spring.cloud.stream.bindings.paymentCompletedConsumer-in-0.group=order-service-group
spring.cloud.stream.bindings.paymentFailedConsumer-in-0.destination=fruitshop.payments.failed
spring.cloud.stream.bindings.paymentFailedConsumer-in-0.group=order-service-group
spring.cloud.stream.bindings.refundCompletedConsumer-in-0.destination=fruitshop.refunds.completed
spring.cloud.stream.bindings.refundCompletedConsumer-in-0.group=order-service-group
spring.cloud.stream.bindings.refundFailedConsumer-in-0.destination=fruitshop.refunds.failed
spring.cloud.stream.bindings.refundFailedConsumer-in-0.group=order-service-group
spring.cloud.stream.bindings.accountDeactivatedConsumer-in-0.destination=fruitshop.accounts.deactivated
spring.cloud.stream.bindings.accountDeactivatedConsumer-in-0.group=order-service-group

# Jackson Config to handle null for primitives (Matches monolithic behavior)
spring.jackson.deserialization.fail-on-null-for-primitives=false
